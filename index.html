<!DOCTYPE html>
<html lang="vi" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chào mừng đã đến với trang web này! :3</title>
    <link rel="icon" href="favicon.png">
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Plus Jakarta Sans', 'sans-serif']
                    }
                }
            }
        }
    </script>
    <!-- Google Fonts & FontAwesome -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #070b14;
            color: #f3f4f6;
            overflow-x: hidden;
        }

        /* Background starry/lantern night vibe */
        .night-bg {
            background: linear-gradient(135deg, rgba(15, 23, 42, 0.85) 0%, rgba(7, 11, 20, 0.95) 100%),
                        url('https://images.unsplash.com/photo-1519681393784-d120267933ba?auto=format&fit=crop&w=2000&q=80') no-repeat center center fixed;
            background-size: cover;
        }

        /* Glassmorphism Card Style */
        .glass-card {
            background: rgba(18, 24, 38, 0.45);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        /* Floating bokeh particle effects */
        @keyframes floatSlow {
            0%, 100% { transform: translateY(0px) scale(1); opacity: 0.6; }
            50% { transform: translateY(-20px) scale(1.1); opacity: 1; }
        }
        .bokeh-particle {
            animation: floatSlow 6s ease-in-out infinite;
        }
    </style>
</head>
<body class="night-bg min-h-screen flex flex-col justify-between items-center px-4 py-8 relative selection:bg-amber-500 selection:text-white">

    <div class="absolute top-1/4 left-10 w-3 h-3 bg-amber-300 rounded-full blur-[1px] bokeh-particle pointer-events-none"></div>
    <div class="absolute top-1/3 right-16 w-4 h-4 bg-amber-400 rounded-full blur-[2px] bokeh-particle pointer-events-none" style="animation-delay: 2s;"></div>

    <!-- Main Spacer to center content -->
    <div class="flex-1 flex items-center justify-center w-full max-w-xl my-auto">
        
        <div class="glass-card w-full rounded-[2.5rem] p-8 sm:p-10 text-center flex flex-col items-center relative overflow-hidden">
            
            <!-- Subtle internal glow -->
            <div class="absolute -top-24 -right-24 w-48 h-48 bg-amber-500/10 rounded-full blur-3xl pointer-events-none"></div>
            
            <!-- Heading -->

                Chào mừng đến với trang web này! :3
            </h1>

            <!-- Avatar Circle -->

                <img src="https://i.ibb.co/BV4XQZkG/IMG-8772.png" 
                     alt="Simpchuas Avatar"

                     onerror="this.src='https://placehold.co/200x200/1e293b/ffffff?text=Avatar'">
            </div>

            <!-- Bio Description -->
            <div class="space-y-2 text-gray-300 text-sm sm:text-base font-normal max-w-md mx-auto mb-8 leading-relaxed">
                <p>Cin chào, tớ là <span class="text-white font-semibold">Tuyết</span> — tớ đang là K67 của Đại học Kinh tế Quốc dân, là một hướng nội cởi mở và chỉ vậy thôi.</p>
                <p class="text-gray-400 text-xs sm:text-sm">Đây là một vài thông tin của tớ~</p>
            </div>

            <div class="flex items-center justify-center space-x-4">
                <!-- Discord Button -->
               <a href="https://www.facebook.com/bbie.prett" target="_blank" rel="noopener noreferrer"
           title="Facebook"
           class="w-12 h-12 rounded-2xl bg-white/5 hover:bg-white/15 border border-white/10 flex items-center justify-center text-gray-200 hover:text-white transition-all duration-300 transform hover:scale-110 shadow-lg group">
            <i class="fa-brands fa-facebook text-lg group-hover:text-blue-400 transition"></i>
        </a>

                <!-- Music / Analytics Button -->
                <a href="https://luami.duckdns.org/status/nginx" target="_blank" rel="noopener noreferrer" 
                   title="Music Space"
                   class="w-12 h-12 rounded-2xl bg-white/5 hover:bg-white/15 border border-white/10 flex items-center justify-center text-gray-200 hover:text-white transition-all duration-300 transform hover:scale-110 shadow-lg group">
                    <i class="fa-solid fa-chart-line text-lg group-hover:text-amber-400 transition"></i>
                </a>

                <!-- Services / Jellyfin Button -->

                   class="w-12 h-12 rounded-2xl bg-white/5 hover:bg-white/15 border border-white/10 flex items-center justify-center text-gray-200 hover:text-white transition-all duration-300 transform hover:scale-110 shadow-lg group">
                    <i class="fa-solid fa-photo-film text-lg group-hover:text-blue-400 transition"></i>
                </a>
            </div>

        </div>
    </div>

    <footer class="w-full text-center mt-6 text-xs text-gray-400 font-medium tracking-wide">
        <p>© 2026 Luami • Add me on Facebook: <span class="text-gray-300 font-semibold">D Phuong Tuyets</span></p>
    </footer>

    <script>
        function showToast(message, type = 'success') {
            const existingToast = document.getElementById('toast-box');
            if (existingToast) existingToast.remove();

            const toast = document.createElement('div');
            toast.id = 'toast-box';
            toast.className = `fixed top-5 right-5 z-50 bg-indigo-600 text-white px-4 py-3 rounded-xl shadow-2xl flex items-center space-x-2 text-xs font-semibold transform transition-all duration-300 translate-y-0`;
            toast.innerHTML = `<i class="fa-solid fa-circle-info text-sm"></i><span>${message}</span>`;
            document.body.appendChild(toast);

            setTimeout(() => {
                toast.classList.add('translate-y-[-20px]', 'opacity-0');
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }
    </script>
</body>
</html>
